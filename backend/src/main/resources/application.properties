spring.application.name=ServiceFlow

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/serviceflow_db}
spring.datasource.username=${DB_USERNAME:serviceflow_user}
spring.datasource.password=${DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true